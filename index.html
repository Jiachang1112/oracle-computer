<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Cloud God Mode Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #1a1b1e;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border-color: #2c2d30;
            --accent-green: #00b85c;
            --accent-blue: #0099ff;
            --accent-red: #ff3366;
            --accent-yellow: #ffcc00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header .live-badge {
            margin-left: auto;
            background: var(--accent-green);
            color: #000;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--border-color);
        }
        .card.cpu-card::before { background: var(--accent-blue); }
        .card.ram-card::before { background: var(--accent-yellow); }
        .card.vpn-card::before { background: var(--accent-red); }
        .card.pm2-card::before { background: var(--accent-green); }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .big-data {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        .big-data .unit {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .progress-bg {
            background: #000;
            border-radius: 4px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar {
            height: 100%;
            transition: width 0.3s ease;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 8px 0;
            border-bottom: 1px solid #222;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(0, 184, 92, 0.15);
            color: var(--accent-green);
        }
        .badge.offline {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
        }
        
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .terminal-header {
            background: #1a1b1e;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .mac-btn { width: 10px; height: 10px; border-radius: 50%; }
        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27c93f; }
        .terminal-title {
            margin-left: 10px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .log-viewer {
            flex-grow: 1;
            padding: 15px;
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .right-panel { min-height: 400px; }
        }
    </style>
</head>
<body>

    <div class="header">
        Oracle Cloud God Mode Dashboard
        <div class="live-badge">LIVE</div>
    </div>

    <div class="left-panel">
        <!-- CPU 卡片 -->
        <div class="card cpu-card">
            <h3>CPU Utilization</h3>
            <div class="big-data" style="color: var(--accent-blue);">
                <span id="sys-cpu-num">0.00</span><span class="unit">%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-bar" id="cpu-bar" style="width: 0%; background: var(--accent-blue);"></div>
            </div>
        </div>

        <!-- 記憶體用量 (24GB) -->
        <div class="card ram-card">
            <h3>Memory Usage (Total: <span id="sys-ram-total">24</span> GB)</h3>
            <div class="big-data" style="color: var(--accent-yellow);">
                <span id="sys-ram-num">0.00</span><span class="unit">GB</span>
            </div>
            <div class="progress-bg">
                <div class="progress-bar" id="ram-bar" style="width: 0%; background: var(--accent-yellow);"></div>
            </div>
        </div>

        <!-- 🌟 VPN 服務健康與即時連線用戶卡片 -->
        <div class="card vpn-card">
            <h3>
                VPN Status & Clients
                <span id="vpn-badge" class="badge offline"><span class="dot"></span>CHECKING</span>
            </h3>
            <table>
                <thead>
                    <tr>
                        <th>CLIENT / INTERFACE</th>
                        <th>STATUS</th>
                        <th>DETAILS</th>
                    </tr>
                </thead>
                <tbody id="vpn-client-list">
                    <tr><td colspan="3" style="text-align:center; color:#888;">載入中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- PM2 卡片 -->
        <div class="card pm2-card">
            <h3>PM2 Processes</h3>
            <table>
                <thead>
                    <tr>
                        <th>APP</th>
                        <th>STATUS</th>
                        <th>CPU</th>
                        <th>RAM</th>
                        <th>RESTARTS</th>
                    </tr>
                </thead>
                <tbody id="pm2-list">
                    <tr><td colspan="5" style="text-align:center; color:#888;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="right-panel">
        <div class="terminal-header">
            <div class="mac-btn close"></div>
            <div class="mac-btn minimize"></div>
            <div class="mac-btn maximize"></div>
            <div class="terminal-title">ubuntu@oracle:~ pm2 logs download_bot</div>
        </div>
        <div class="log-viewer" id="log-viewer">Waiting for connection...</div>
    </div>

    <script>
        const API_BASE = "https://oracle.chiacheng1112.com"; 

        async function updateDashboard() {
            try {
                // 1. 更新系統資源
                const sysRes = await fetch(`${API_BASE}/api/status`);
                const sysData = await sysRes.json();
                document.getElementById('sys-cpu-num').innerText = parseFloat(sysData.cpu_percent).toFixed(2);
                document.getElementById('cpu-bar').style.width = `${sysData.cpu_percent}%`;

                const ramPercent = (sysData.ram_used_gb / sysData.ram_total_gb) * 100;
                document.getElementById('sys-ram-num').innerText = parseFloat(sysData.ram_used_gb).toFixed(2);
                document.getElementById('sys-ram-total').innerText = sysData.ram_total_gb;
                document.getElementById('ram-bar').style.width = `${ramPercent}%`;

                // 2. 🌟 更新 VPN 服務與客戶端數據
                const procRes = await fetch(`${API_BASE}/api/system-processes`);
                const procData = await procRes.json();

                const vpnBadge = document.getElementById('vpn-badge');
                if (procData.service_running) {
                    vpnBadge.className = 'badge';
                    vpnBadge.innerHTML = '<span class="dot"></span>SERVICE RUNNING';
                } else {
                    vpnBadge.className = 'badge offline';
                    vpnBadge.innerHTML = '<span class="dot"></span>SERVICE STOPPED';
                }

                let clientHTML = '';
                if (procData.vpn_clients && procData.vpn_clients.length > 0) {
                    procData.vpn_clients.forEach(c => {
                        clientHTML += `
                            <tr>
                                <td style="color: var(--accent-green);">${c.peer}</td>
                                <td style="color: #fff;">${c.status}</td>
                                <td style="color: var(--accent-yellow);">${c.details}</td>
                            </tr>
                        `;
                    });
                } else {
                    clientHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">目前無外部用戶連線</td></tr>`;
                }
                document.getElementById('vpn-client-list').innerHTML = clientHTML;

                // 3. 更新 PM2
                const pm2Res = await fetch(`${API_BASE}/api/pm2`);
                const pm2Data = await pm2Res.json();
                let tableHTML = '';
                pm2Data.forEach(p => {
                    const isOnline = p.status === 'online';
                    const badgeClass = isOnline ? 'badge' : 'badge offline';
                    tableHTML += `
                        <tr>
                            <td style="color: #fff;">${p.name}</td>
                            <td><span class="${badgeClass}"><span class="dot"></span>${p.status}</span></td>
                            <td>${p.cpu}%</td>
                            <td>${p.memory} MB</td>
                            <td style="color: var(--accent-red);">${p.restarts}</td>
                        </tr>
                    `;
                });
                document.getElementById('pm2-list').innerHTML = tableHTML;

                // 4. 更新日誌
                const logRes = await fetch(`${API_BASE}/api/logs`);
                const logData = await logRes.json();
                const logViewer = document.getElementById('log-viewer');
                if(logViewer.innerText !== logData.logs) {
                    logViewer.innerText = logData.logs || "No logs available...";
                    logViewer.scrollTop = logViewer.scrollHeight; 
                }

            } catch (error) {
                console.error("Fetch failed:", error);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1500);
    </script>
</body>
</html>
