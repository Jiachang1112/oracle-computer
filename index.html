<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Dashboard</title>
    <!-- 引入高質感字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 30px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            gap: 30px;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            background: #000000;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 進度條樣式 */
        .stat-row {
            margin-bottom: 15px;
        }
        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            font-weight: 700;
        }
        .progress-bg {
            background: #0f172a;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .progress-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease-out;
        }

        /* 表格樣式 */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            text-align: left;
            padding-bottom: 12px;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 12px 0;
            border-bottom: 1px solid #233146;
            font-family: 'JetBrains Mono', monospace;
        }
        tr:last-child td { border-bottom: none; }
        
        /* 狀態標籤 */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }
        .badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }
        .badge:not(.offline) .dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 終端機樣式 */
        .terminal-header {
            background: #1e293b;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27c93f; }
        .terminal-title {
            margin-left: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .log-viewer {
            flex-grow: 1;
            padding: 20px;
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="card">
            <h3>⚡ 系統資源監控</h3>
            
            <div class="stat-row">
                <div class="stat-header">
                    <span>CPU 使用率</span>
                    <span class="stat-value" id="sys-cpu">-- %</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-bar" id="cpu-bar" style="width: 0%; background: var(--accent-blue);"></div>
                </div>
            </div>

            <div class="stat-row">
                <div class="stat-header">
                    <span>記憶體用量 (24GB)</span>
                    <span class="stat-value" id="sys-ram">-- / -- GB</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-bar" id="ram-bar" style="width: 0%; background: var(--accent-green);"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🚀 PM2 運作清單</h3>
            <table>
                <thead>
                    <tr>
                        <th>服務名稱</th>
                        <th>狀態</th>
                        <th>CPU</th>
                        <th>RAM</th>
                        <th>重啟</th>
                    </tr>
                </thead>
                <tbody id="pm2-list">
                    <tr><td colspan="5" style="text-align:center; color:#94a3b8;">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="right-panel">
        <div class="terminal-header">
            <div class="mac-btn close"></div>
            <div class="mac-btn minimize"></div>
            <div class="mac-btn maximize"></div>
            <div class="terminal-title">bash - pm2 logs download_bot</div>
        </div>
        <div class="log-viewer" id="log-viewer">等待連線中...</div>
    </div>

    <script>
        const IP = "163.192.107.139"; 

        async function updateDashboard() {
            try {
                // 1. 更新系統資源
                const sysRes = await fetch(`http://${IP}:5000/api/status`);
                const sysData = await sysRes.json();
                
                document.getElementById('sys-cpu').innerText = `${sysData.cpu_percent} %`;
                document.getElementById('cpu-bar').style.width = `${sysData.cpu_percent}%`;

                const ramPercent = (sysData.ram_used_gb / sysData.ram_total_gb) * 100;
                document.getElementById('sys-ram').innerText = `${sysData.ram_used_gb} / ${sysData.ram_total_gb} GB`;
                document.getElementById('ram-bar').style.width = `${ramPercent}%`;

                // 2. 更新 PM2 清單
                const pm2Res = await fetch(`http://${IP}:5000/api/pm2`);
                const pm2Data = await pm2Res.json();
                
                let tableHTML = '';
                pm2Data.forEach(p => {
                    const isOnline = p.status === 'online';
                    const badgeClass = isOnline ? 'badge' : 'badge offline';
                    tableHTML += `
                        <tr>
                            <td style="color: #f8fafc;">${p.name}</td>
                            <td><span class="${badgeClass}"><span class="dot"></span>${p.status}</span></td>
                            <td>${p.cpu}%</td>
                            <td>${p.memory} MB</td>
                            <td style="color: #ef4444;">${p.restarts}</td>
                        </tr>
                    `;
                });
                document.getElementById('pm2-list').innerHTML = tableHTML;

                // 3. 更新日誌
                const logRes = await fetch(`http://${IP}:5000/api/logs`);
                const logData = await logRes.json();
                const logViewer = document.getElementById('log-viewer');
                
                if(logViewer.innerText !== logData.logs) {
                    logViewer.innerText = logData.logs || "尚無日誌紀錄...";
                    logViewer.scrollTop = logViewer.scrollHeight; 
                }

            } catch (error) {
                console.error("更新失敗:", error);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1500);
    </script>
</body>
</html>
